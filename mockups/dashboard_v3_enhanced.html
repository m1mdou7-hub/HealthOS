<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthOS V3 - لوحة التحكم الشاملة متعددة الأدوار</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #040406;
      --bg-card: rgba(18, 18, 24, 0.8);
      --bg-card-hover: rgba(28, 28, 38, 0.95);
      --border-color: rgba(255, 255, 255, 0.05);
      --accent-orange: #ff6b00;
      --accent-orange-glow: rgba(255, 107, 0, 0.12);
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-red: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dark: #4b5563;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Cairo', 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      padding: 16px;
      overflow: hidden;
      gap: 16px;
      background-image: 
        radial-gradient(circle at 5% 5%, rgba(255, 107, 0, 0.02) 0%, transparent 40%),
        radial-gradient(circle at 95% 95%, rgba(139, 92, 246, 0.02) 0%, transparent 40%);
    }

    /* Sidebar Navigation */
    .sidebar {
      width: 240px;
      background-color: rgba(10, 10, 14, 0.95);
      backdrop-filter: blur(25px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      padding: 20px 14px;
      gap: 20px;
      flex-shrink: 0;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 6px;
    }

    .logo-box {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--accent-orange), #ff8c00);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #000;
      font-size: 18px;
    }

    .brand-name {
      font-weight: 700;
      font-size: 15px;
      color: #fff;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .nav-list::-webkit-scrollbar {
      display: none;
    }

    .nav-item {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .nav-item:hover, .nav-item.active {
      color: #fff;
      background-color: rgba(255, 255, 255, 0.02);
    }

    .nav-item.active {
      background-color: var(--accent-orange-glow);
      border-color: rgba(255, 107, 0, 0.15);
      color: var(--accent-orange);
    }

    /* Workspace */
    .workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    /* Top Bar */
    .top-bar {
      height: 64px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(15px);
      z-index: 10;
    }

    .role-switcher-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .switcher-label {
      font-size: 11px;
      font-weight: 750;
      color: var(--text-muted);
    }

    .role-select {
      background-color: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 6px 12px;
      color: var(--accent-orange);
      font-size: 12px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      font-family: inherit;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-header {
      background-color: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-header.primary {
      background-color: var(--accent-orange);
      color: #000;
      border: none;
    }

    .btn-header.primary:hover {
      background-color: #ff8c00;
    }

    /* Dashboard Layout */
    .dashboard-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      padding-bottom: 16px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .stat-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100px;
      transition: all 0.25s ease;
    }

    .stat-card.highlight {
      background: linear-gradient(135deg, var(--accent-orange), #ff8c00);
      border: none;
      box-shadow: 0 8px 20px rgba(255, 107, 0, 0.12);
    }

    .stat-card.highlight .stat-value,
    .stat-card.highlight .stat-label,
    .stat-card.highlight .stat-sub {
      color: #000 !important;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      margin: 4px 0;
    }

    .stat-sub {
      font-size: 9px;
      color: var(--text-dark);
      font-weight: 600;
    }

    /* 2-Column Main Workspace */
    .columns-grid {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 16px;
    }

    /* Panel Card */
    .panel-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      backdrop-filter: blur(15px);
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
      padding-bottom: 10px;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 750;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-subtitle {
      font-size: 9px;
      color: var(--text-dark);
      font-weight: 600;
    }

    /* Custom Tables */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
    }

    .data-table th {
      padding: 8px 10px;
      font-size: 9px;
      color: var(--text-dark);
      font-weight: 700;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }

    .data-table td {
      padding: 10px 10px;
      font-size: 11.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.01);
    }

    /* Progress bar */
    .progress-bar-bg {
      height: 6px;
      background-color: rgba(255, 255, 255, 0.03);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: var(--accent-orange);
      border-radius: 4px;
    }

    /* Kanban Board for Lab */
    .kanban-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .kanban-column {
      background-color: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.02);
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .kanban-header {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
      padding-bottom: 4px;
    }

    .kanban-card {
      background-color: rgba(15, 15, 20, 0.95);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
    }

    .kanban-card-title {
      font-size: 10.5px;
      font-weight: 700;
      color: #fff;
    }

    .kanban-card-desc {
      font-size: 8.5px;
      color: var(--text-dark);
    }

    /* Timeline list */
    .timeline-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      padding-right: 16px;
      border-right: 1px solid rgba(255, 255, 255, 0.03);
    }

    .timeline-item {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .timeline-dot {
      position: absolute;
      right: -21px;
      top: 4px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: var(--text-dark);
      border: 2px solid var(--bg-base);
    }

    .timeline-dot.active {
      background-color: var(--accent-orange);
    }

    .timeline-dot.green {
      background-color: var(--accent-green);
    }

    .timeline-dot.red {
      background-color: var(--accent-red);
    }

    .timeline-item-title {
      font-size: 11px;
      font-weight: 600;
      color: #fff;
    }

    .timeline-item-sub {
      font-size: 8.5px;
      color: var(--text-dark);
    }

    /* Inputs */
    .form-input {
      background-color: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11.5px;
      color: #fff;
      outline: none;
      width: 100%;
    }

    .form-input:focus {
      border-color: var(--accent-orange);
    }

    /* Badges */
    .badge {
      font-size: 8.5px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    .badge-orange {
      background-color: rgba(255, 107, 0, 0.1);
      color: var(--accent-orange);
      border: 1px solid rgba(255, 107, 0, 0.15);
    }

    .badge-green {
      background-color: rgba(16, 185, 129, 0.1);
      color: var(--accent-green);
      border: 1px solid rgba(16, 185, 129, 0.15);
    }

    .badge-red {
      background-color: rgba(239, 68, 68, 0.1);
      color: var(--accent-red);
      border: 1px solid rgba(239, 68, 68, 0.15);
    }

    .badge-blue {
      background-color: rgba(59, 130, 246, 0.1);
      color: var(--accent-blue);
      border: 1px solid rgba(59, 130, 246, 0.15);
    }

    /* Transition animations */
    .fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(2px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

    // Switch Role render engine
    function switchRole(roleId) {
      const data = rolesData[roleId];
      if (!data) return;

      const content = document.getElementById('dashboard-content');
      content.classList.remove('fade-in');
      void content.offsetWidth;
      content.classList.add('fade-in');

      // 1. Sidebar Links
      const navList = document.getElementById('sidebar-nav');
      navList.innerHTML = '';
      data.nav.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `nav-item ${index === 0 ? 'active' : ''}`;
        div.innerHTML = `
          <span class="nav-icon">${item.icon}</span>
          <span>${item.label}</span>
        `;
        navList.appendChild(div);
      });

      // 2. Header actions
      const actionsContainer = document.getElementById('header-actions');
      actionsContainer.innerHTML = '';
      data.actions.forEach(action => {
        const btn = document.createElement('button');
        btn.className = `btn-header ${action.primary ? 'primary' : ''}`;
        btn.textContent = action.label;
        btn.onclick = () => alert(`تم تفعيل إجراء: ${action.label}`);
        actionsContainer.appendChild(btn);
      });

      // 3. Stats grid
      const statsGrid = document.getElementById('stats-grid');
      statsGrid.innerHTML = '';
      data.stats.forEach(card => {
        const div = document.createElement('div');
        div.className = `stat-card ${card.highlight ? 'highlight' : ''}`;
        div.innerHTML = `
          <span class="stat-label">${card.label}</span>
          <span class="stat-value">${card.value}</span>
          <span class="stat-sub">${card.sub}</span>
        `;
        statsGrid.appendChild(div);
      });

      // 4. Primary and secondary dashboards
      document.getElementById('primary-panel').innerHTML = data.primary;
      document.getElementById('secondary-panel').innerHTML = data.secondary;
    }

    window.onload = () => {
      switchRole('clinician');
    };
  </script>
